[pytest]
# Pytest configuration for flower-detection project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test organization
markers =
    integration: Mark test as an integration test requiring model weights
    unit: Mark test as a unit test
    api: Mark test as testing API endpoints
    schemas: Mark test as testing Pydantic schemas

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=. --cov-report=html
